<svg xmlns="http://www.w3.org/2000/svg" width="850" height="240" viewBox="0 0 850 240">
  <defs>
    <!-- Cycling Holographic Gradient -->
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff">
        <animate attributeName="stop-color" values="#00f0ff;#a855f7;#ec4899;#00f0ff" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#a855f7">
        <animate attributeName="stop-color" values="#a855f7;#ec4899;#00f0ff;#a855f7" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#ec4899">
        <animate attributeName="stop-color" values="#ec4899;#00f0ff;#a855f7;#ec4899" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Text Light Shimmer Gradient -->
    <linearGradient id="shimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#00f0ff" stop-opacity="1">
        <animate attributeName="stop-color" values="#00f0ff;#ffffff;#a855f7;#00f0ff" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Radial Core Ambient Glow -->
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.18">
        <animate attributeName="stop-opacity" values="0.12;0.25;0.12" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="60%" stop-color="#a855f7" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#08090d" stop-opacity="0"/>
    </radialGradient>

    <!-- Corner Clip with Rounded Edges -->
    <clipPath id="cardClip">
      <rect width="850" height="240" rx="14" />
    </clipPath>
  </defs>

  <g clip-path="url(#cardClip)">
    <!-- Deep Space Background -->
    <rect width="850" height="240" fill="#08090d" />

    <!-- Ambient Glow Orb -->
    <circle cx="425" cy="120" r="320" fill="url(#coreGlow)" />

    <!-- Flowing Perspective Grid -->
    <g opacity="0.18" stroke="#00f0ff" stroke-width="0.5">
      <line x1="0" y1="200" x2="850" y2="200"/>
      <line x1="0" y1="215" x2="850" y2="215"/>
      <line x1="0" y1="230" x2="850" y2="230"/>
      <line x1="425" y1="180" x2="0" y2="240"/>
      <line x1="425" y1="180" x2="150" y2="240"/>
      <line x1="425" y1="180" x2="300" y2="240"/>
      <line x1="425" y1="180" x2="425" y2="240"/>
      <line x1="425" y1="180" x2="550" y2="240"/>
      <line x1="425" y1="180" x2="700" y2="240"/>
      <line x1="425" y1="180" x2="850" y2="240"/>
    </g>

    <!-- Rotating 3D Geometry Outer Wireframe Ring -->
    <g transform="translate(425, 120)">
      <circle cx="0" cy="0" r="140" fill="none" stroke="url(#cyberGrad)" stroke-width="1.2" stroke-dasharray="8 12" opacity="0.45">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="20s" repeatCount="indefinite"/>
      </circle>
      <circle cx="0" cy="0" r="170" fill="none" stroke="#00f0ff" stroke-width="0.8" stroke-dasharray="4 20" opacity="0.3">
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="30s" repeatCount="indefinite"/>
      </circle>
      <polygon points="0,-110 95,-55 95,55 0,110 -95,55 -95,-55" fill="none" stroke="url(#cyberGrad)" stroke-width="0.8" opacity="0.3">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="24s" repeatCount="indefinite"/>
      </polygon>
      <polygon points="0,-90 78,-45 78,45 0,90 -78,45 -78,-45" fill="none" stroke="#ec4899" stroke-width="0.5" stroke-dasharray="6 6" opacity="0.25">
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="18s" repeatCount="indefinite"/>
      </polygon>
    </g>

    <!-- Floating Cyber Particles -->
    <circle cx="120" cy="70" r="2.5" fill="#00f0ff">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="70;62;70" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="730" cy="60" r="2.5" fill="#ec4899">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="60;52;60" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="200" cy="180" r="2" fill="#a855f7">
      <animate attributeName="opacity" values="0.1;0.9;0.1" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="680" cy="170" r="2" fill="#00f0ff">
      <animate attributeName="opacity" values="0.2;0.8;0.2" dur="4.5s" repeatCount="indefinite"/>
    </circle>

    <!-- Dynamic Animated Laser Sine Waves -->
    <path fill="none" stroke="url(#cyberGrad)" stroke-width="2" opacity="0.75">
      <animate attributeName="d" dur="6s" repeatCount="indefinite" values="
        M -50 200 Q 150 160 350 200 T 750 200 T 950 200;
        M -50 200 Q 150 230 350 190 T 750 210 T 950 200;
        M -50 200 Q 150 170 350 210 T 750 190 T 950 200;
        M -50 200 Q 150 160 350 200 T 750 200 T 950 200
      "/>
    </path>
    <path fill="none" stroke="#00f0ff" stroke-width="1" opacity="0.4">
      <animate attributeName="d" dur="8s" repeatCount="indefinite" values="
        M -50 210 Q 200 230 450 195 T 850 210 T 950 210;
        M -50 210 Q 200 180 450 220 T 850 195 T 950 210;
        M -50 210 Q 200 230 450 195 T 850 210 T 950 210
      "/>
    </path>

    <!-- Glowing Top System Header Bar -->
    <rect x="25" y="16" width="800" height="24" rx="12" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.08)" stroke-width="0.8" />
    <circle cx="45" cy="28" r="3.5" fill="#00ff88">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="56" y="32" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="10" font-weight="700" fill="#00ff88" letter-spacing="1.5">SYSTEM ACTIVE</text>
    <text x="760" y="32" text-anchor="end" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="10" font-weight="600" fill="#64748b" letter-spacing="1">PORT 443 // ENCRYPTED</text>

    <!-- MAIN NAME TYPOGRAPHY -->
    <text x="425" y="118" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="44" font-weight="900" fill="url(#shimmer)" letter-spacing="4">
      CHANNA KAVISHKA
    </text>

    <!-- SUBTITLE WITH CYCLING GRADIENT -->
    <text x="425" y="152" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="14" font-weight="700" fill="url(#cyberGrad)" letter-spacing="6">
      FULL-STACK &amp; 3D WebXR SOFTWARE ENGINEER
    </text>

    <!-- Sleek Tech Micro-Badge Pills Inside Banner -->
    <g transform="translate(425, 178)">
      <rect x="-240" y="0" width="150" height="22" rx="11" fill="rgba(0,240,255,0.08)" stroke="#00f0ff" stroke-width="0.6"/>
      <text x="-165" y="14" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="9.5" font-weight="700" fill="#00f0ff" letter-spacing="1">CARDIFF MET '26</text>

      <rect x="-70" y="0" width="140" height="22" rx="11" fill="rgba(168,85,247,0.08)" stroke="#a855f7" stroke-width="0.6"/>
      <text x="0" y="14" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="9.5" font-weight="700" fill="#c084fc" letter-spacing="1">Three.js • WebGL</text>

      <rect x="90" y="0" width="150" height="22" rx="11" fill="rgba(236,72,153,0.08)" stroke="#ec4899" stroke-width="0.6"/>
      <text x="165" y="14" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="9.5" font-weight="700" fill="#f472b6" letter-spacing="1">SPRING BOOT • REACT</text>
    </g>

    <!-- Outer Card Glowing Border -->
    <rect x="0.5" y="0.5" width="849" height="239" rx="14" fill="none" stroke="url(#cyberGrad)" stroke-width="1.2" opacity="0.65">
      <animate attributeName="opacity" values="0.4;0.85;0.4" dur="4s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
