<svg xmlns="http://www.w3.org/2000/svg" width="850" height="2" viewBox="0 0 850 2">
  <defs>
    <linearGradient id="divGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#08090d;stop-opacity:1"/>
      <stop offset="20%" style="stop-color:#00f0ff;stop-opacity:1">
        <animate attributeName="stop-color" values="#00f0ff;#7928ca;#ff0055;#00f0ff" dur="5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" style="stop-color:#7928ca;stop-opacity:1">
        <animate attributeName="stop-color" values="#7928ca;#ff0055;#00f0ff;#7928ca" dur="5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="80%" style="stop-color:#ff0055;stop-opacity:1">
        <animate attributeName="stop-color" values="#ff0055;#00f0ff;#7928ca;#ff0055" dur="5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#08090d;stop-opacity:1"/>
    </linearGradient>
  </defs>
  <rect width="850" height="2" fill="url(#divGrad)"/>
</svg>
