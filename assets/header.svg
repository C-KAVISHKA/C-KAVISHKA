<svg xmlns="http://www.w3.org/2000/svg" width="854" height="160" viewBox="0 0 854 160">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff">
        <animate attributeName="stop-color" values="#00f0ff;#7c3aed;#f43f5e;#00f0ff" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#7c3aed">
        <animate attributeName="stop-color" values="#7c3aed;#f43f5e;#00f0ff;#7c3aed" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#f43f5e">
        <animate attributeName="stop-color" values="#f43f5e;#00f0ff;#7c3aed;#f43f5e" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <filter id="gl"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="gr" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="rgba(0,240,255,0.035)" stroke-width="0.5"/>
    </pattern>
  </defs>

  <rect width="854" height="160" rx="10" fill="#0a0b10"/>
  <rect width="854" height="160" rx="10" fill="url(#gr)"/>
  <rect x="1" y="1" width="852" height="158" rx="10" fill="none" stroke="url(#g1)" stroke-width="1" opacity="0.4">
    <animate attributeName="opacity" values="0.25;0.5;0.25" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- Corner marks -->
  <path d="M 16 5 L 5 5 L 5 16" fill="none" stroke="#00f0ff" stroke-width="1.5" opacity="0.5"/>
  <path d="M 838 5 L 849 5 L 849 16" fill="none" stroke="#00f0ff" stroke-width="1.5" opacity="0.5"/>
  <path d="M 16 155 L 5 155 L 5 144" fill="none" stroke="#00f0ff" stroke-width="1.5" opacity="0.5"/>
  <path d="M 838 155 L 849 155 L 849 144" fill="none" stroke="#00f0ff" stroke-width="1.5" opacity="0.5"/>

  <!-- Name -->
  <text x="427" y="62" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="bold" fill="url(#g1)" filter="url(#gl)" letter-spacing="6">CHANNA KAVISHKA</text>
  
  <!-- Role -->
  <text x="427" y="90" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#94a3b8" letter-spacing="4">FULL-STACK  |  3D WebXR  |  ENTERPRISE SYSTEMS</text>
  
  <!-- Thin line -->
  <line x1="260" y1="102" x2="594" y2="102" stroke="url(#g1)" stroke-width="0.6" opacity="0.3"/>

  <!-- Bottom chips -->
  <rect x="225" y="114" width="120" height="24" rx="12" fill="rgba(0,240,255,0.06)" stroke="rgba(0,240,255,0.2)" stroke-width="0.5"/>
  <text x="285" y="130" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#00f0ff">Sri Lanka</text>

  <rect x="365" y="114" width="124" height="24" rx="12" fill="rgba(124,58,237,0.06)" stroke="rgba(124,58,237,0.2)" stroke-width="0.5"/>
  <text x="427" y="130" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#a78bfa">Cardiff Met '26</text>

  <rect x="509" y="114" width="120" height="24" rx="12" fill="rgba(244,63,94,0.06)" stroke="rgba(244,63,94,0.2)" stroke-width="0.5"/>
  <text x="569" y="130" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#f43f5e">BSc Software Eng</text>
</svg>
