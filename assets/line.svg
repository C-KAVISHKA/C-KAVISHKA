<svg xmlns="http://www.w3.org/2000/svg" width="854" height="6" viewBox="0 0 854 6">
  <defs>
    <linearGradient id="lg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="10%" stop-color="#00f0ff">
        <animate attributeName="stop-color" values="#00f0ff;#7c3aed;#f43f5e;#00f0ff" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#7c3aed">
        <animate attributeName="stop-color" values="#7c3aed;#f43f5e;#00f0ff;#7c3aed" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="90%" stop-color="#f43f5e">
        <animate attributeName="stop-color" values="#f43f5e;#00f0ff;#7c3aed;#f43f5e" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>
  </defs>
  <rect y="2" width="854" height="2" rx="1" fill="url(#lg)" opacity="0.7"/>
</svg>
