<svg xmlns="http://www.w3.org/2000/svg" width="850" height="4" viewBox="0 0 850 4">
  <defs>
    <linearGradient id="dg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#08090d"/>
      <stop offset="15%" style="stop-color:#00f0ff">
        <animate attributeName="stop-color" values="#00f0ff;#7928ca;#ff0055;#00f0ff" dur="5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" style="stop-color:#7928ca">
        <animate attributeName="stop-color" values="#7928ca;#ff0055;#00f0ff;#7928ca" dur="5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="85%" style="stop-color:#ff0055">
        <animate attributeName="stop-color" values="#ff0055;#00f0ff;#7928ca;#ff0055" dur="5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#08090d"/>
