  <rect x="1" y="1" width="852" height="68" rx="8" fill="none" stroke="url(#fg)" stroke-width="0.6" opacity="0.25"/>
  
  <text x="30" y="28" font-family="Consolas,Courier New,monospace" font-size="11" fill="#00f0ff" opacity="0.6">
    &gt; session.status = 200
    <animate attributeName="opacity" values="0.4;0.7;0.4" dur="3s" repeatCount="indefinite"/>
