<svg xmlns="http://www.w3.org/2000/svg" width="854" height="70" viewBox="0 0 854 70">
  <defs>
    <linearGradient id="fg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff">
        <animate attributeName="stop-color" values="#00f0ff;#7c3aed;#f43f5e;#00f0ff" dur="8s" repeatCount="indefinite"/>
