  </rect>
  
  <text x="427" y="64" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="8" fill="#4a5568" letter-spacing="1">CHANNA KAVISHKA  //  FULL-STACK AND 3D WEBXR SOFTWARE ENGINEER  //  CARDIFF MET 2026</text>
