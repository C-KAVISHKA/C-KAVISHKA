<svg xmlns="http://www.w3.org/2000/svg" width="850" height="100" viewBox="0 0 850 100">
  <defs>
    <linearGradient id="fg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00f0ff">
        <animate attributeName="stop-color" values="#00f0ff;#7928ca;#ff0055;#00f0ff" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#7928ca">
        <animate attributeName="stop-color" values="#7928ca;#ff0055;#00f0ff;#7928ca" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <filter id="gl"><feGaussianBlur stdDeviation="1.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="gr" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(0,240,255,0.03)" stroke-width="0.5"/>
    </pattern>
    <clipPath id="rc"><rect width="850" height="100" rx="8"/></clipPath>
  </defs>
  <g clip-path="url(#rc)">
    <rect width="850" height="100" fill="#08090d"/>
    <rect width="850" height="100" fill="url(#gr)"/>
    <rect x="1" y="1" width="848" height="98" rx="8" fill="none" stroke="url(#fg)" stroke-width="0.8" opacity="0.3"/>
    
    <text x="30" y="28" font-family="'Courier New',monospace" font-size="10" fill="#00f0ff" filter="url(#gl)" opacity="0.7">
      &gt; connection.established()
      <animate attributeName="opacity" values="0.4;0.8;0.4" dur="3s" repeatCount="indefinite"/>
    </text>
    <text x="30" y="46" font-family="'Courier New',monospace" font-size="10" fill="#a78bfa" opacity="0.5">
      &gt; stream.listen(port: 443, encryption: "AES-256-GCM")
    </text>
    <text x="30" y="64" font-family="'Courier New',monospace" font-size="10" fill="#6b7280" opacity="0.4">
      &gt; session.status: 200 OK — awaiting incoming transmissions_
    </text>
    <rect x="358" y="54" width="7" height="12" fill="#00f0ff">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
    
    <line x1="20" y1="80" x2="830" y2="80" stroke="#00f0ff" stroke-width="0.3" opacity="0.15"/>
    <text x="425" y="94" text-anchor="middle" font-family="'Courier New',monospace" font-size="8" fill="#4a5568">
      ◈ CHANNA KAVISHKA ◈ FULL-STACK &amp; 3D WEBXR ENGINEER ◈ CARDIFF MET '26 ◈
    </text>
  </g>
</svg>
